<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ============================================================ -->
  <!-- GAMEPIX SDK    -->
  <!-- ============================================================ -->
  <script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#050508" />

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: https://*.gamepix.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://gc.zgo.at https://integration.gamepix.com; connect-src 'self' https://*.goatcounter.com https://*.gamepix.com; frame-src https://*.gamepix.com; object-src 'none'; base-uri 'none'"
  />

  <title>Color Switch Blast</title>

  <meta name="author" content="VRX Games" />
  <meta name="publisher" content="VRX Games" />
  <meta
    name="description"
    content="Color Switch Blast by VRX Games. A fast one-tap arcade game where you switch your ball's color to match incoming neon beams."
  />

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050508'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%2322d3ee'/%3E%3Ccircle cx='68' cy='32' r='14' fill='%23f472b6'/%3E%3Ccircle cx='32' cy='68' r='14' fill='%23facc15'/%3E%3Ccircle cx='68' cy='68' r='14' fill='%234ade80'/%3E%3C/svg%3E"
  />

  <link rel="stylesheet" href="style.css?v=3.0" />
</head>

<body>
  <div id="loader" aria-hidden="true">
    <div class="loader-panel">
      <img
        id="loaderLogo"
        class="loader-logo"
        src="logo.png"
        alt="Color Switch Blast"
      />

      <div id="loaderTitle" class="loader-title">COLOR SWITCH BLAST</div>

      <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="loader-text">LOADING</div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <!-- Analytics (GoatCounter) -->
  <script
    data-goatcounter="https://vikasranax.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"
  ></script>

  <!--
    ============================================================
    YOUTUBE PLAYABLES SDK (later)
    ============================================================
  -->

  <script src="game.js?v=3.0" defer></script>
  <script src="gamepix.js?v=3.0" defer></script>
  <script src="analytics.js?v=3.0" defer></script>
</body>
</html>
